<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinkit - Sign Up</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    width: 380px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 5px 25px #00000012;
    text-align: center;
}

.logo {
    font-size: 36px;
    font-weight: bold;
    color: #f8cb46;
    background: #0c831f;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 10px;
    margin-bottom: 25px;
}

h2 {
    margin-bottom: 10px;
    color: #222;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
}

input:focus {
    outline: 2px solid #0c831f;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0c831f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #086b19;
}

.or {
    margin: 20px 0;
    color: #888;
}

.otp-btn {
    background: #f8cb46;
    color: #222;
}

.otp-btn:hover {
    background: #f1bd20;
}

.footer {
    margin-top: 22px;
    font-size: 14px;
    color: #666;
}

a {
    color: #0c831f;
    text-decoration: none;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>
<div class="container">

    <div class="logo">blinkit</div>

    <h2>Create Account</h2>
    <p class="subtitle">Groceries delivered in minutes!</p>

    <form id="signupForm">
        <input type="text" id="name"
               placeholder="Full Name" required>

        <input type="email" id="email"
               placeholder="Email Address" required>

        <input type="tel" id="phone"
               placeholder="10-digit Mobile Number"
               pattern="[0-9]{10}"
               maxlength="10" required>

        <input type="password" id="password"
               placeholder="Create Password"
               minlength="6" required>

        <button type="submit">Create Account</button>
    </form>

    <div class="or">OR</div>

    <button class="otp-btn" onclick="otpLogin()">
        Continue with OTP
    </button>

    <p id="message"></p>

    <p class="footer">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>
document.getElementById("signupForm")
.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;

    document.getElementById("message").style.color = "#0c831f";
    document.getElementById("message").textContent =
        "Welcome, " + name + "! Demo signup successful.";
});

function otpLogin() {
    const phone = document.getElementById("phone").value;

    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    alert("OTP login selected! Actual OTP delivery requires a backend service.");
}
</script>
</body>
</html>
